server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    gzip             on;
    gzip_min_length  1024;
    gzip_types       text/css application/javascript image/svg+xml application/json;

    # Aplikasi satu halaman: apa pun yang tidak cocok, kembalikan index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nama berkas aset sudah mengandung hash isi, jadi aman di-cache selamanya.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html TIDAK boleh di-cache; ia yang menunjuk ke aset versi terbaru.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /ws {
        proxy_pass         http://server:8787;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;

        # Pertandingan catur bisa lama tanpa ada langkah. Server mengirim ping
        # tiap 30 detik, tapi batas ini diberi kelonggaran besar supaya sambungan
        # tidak pernah diputus proxy di tengah permainan.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
