name: Release

# Dipicu saat tag versi dibuat, misalnya `git tag v1.2.0 && git push --tags`.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  # Tag tidak otomatis berarti kode sehat — jalankan verifikasi yang sama persis
  # dengan yang dipakai di PR sebelum apa pun didorong ke registry.
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      # Kalau salah satu image gagal, biarkan yang lain selesai supaya
      # kegagalannya jelas milik siapa.
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: server/Dockerfile
          - name: client
            dockerfile: client/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Masuk ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token bawaan; tidak perlu menyiapkan secret sendiri.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Susun tag dan label image
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Action ini otomatis menurunkan nama ke huruf kecil — ghcr menolak
          # huruf besar, sedangkan nama repositori GitHub boleh mengandungnya.
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Chess with Mari (${{ matrix.name }})

      - name: Build dan dorong
        uses: docker/build-push-action@v6
        with:
          # Konteksnya akar repo: kedua image memakai paket workspace
          # @chess/shared, jadi tidak bisa di-build dari foldernya sendiri.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
